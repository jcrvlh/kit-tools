<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    Ícone da Tool Divisa — linguagem "Brutalist Bauhaus" do KIT.
    A tela dividida: azul em cima, vermelho embaixo, e a divisa (paper) fora
    do meio — o vermelho está ganhando território. Fonte de verdade; icon.png
    e icon.bin são gerados por scripts/make_icon.py.
  -->
  <rect x="14" y="8" width="212" height="224" rx="24"
        fill="#0A0A0B" stroke="#3A3A3E" stroke-width="3"/>
  <clipPath id="b"><rect x="54" y="54" width="132" height="132" rx="10"/></clipPath>
  <g clip-path="url(#b)">
    <rect x="54" y="54"  width="132" height="54"  fill="#2C3CC4"/>
    <rect x="54" y="108" width="132" height="78"  fill="#C6472F"/>
    <rect x="54" y="104.5" width="132" height="7" fill="#EFEADD"/>
  </g>
</svg>
