<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!--
    Ícone da Tool Juízo — linguagem "Brutalist Bauhaus" do KIT.
    Uma carta escura com uma pedra vermelha (#C6472F) quadrada — não um
    círculo, de propósito, pra não ler como a Bola 8 — e uma janela circular
    escura no centro. Fonte de verdade; icon.png e icon.bin são gerados por
    scripts/make_icon.py.
  -->
  <rect x="14" y="8" width="212" height="224" rx="24"
        fill="#0A0A0B" stroke="#3A3A3E" stroke-width="3"/>
  <rect x="45" y="47" width="150" height="150" rx="26" fill="#C6472F"/>
  <circle cx="120" cy="122" r="44" fill="#0A0A0B"/>
</svg>
