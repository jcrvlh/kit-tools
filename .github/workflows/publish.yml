name: Publicar pacote .kit

# Compila a Tool para o ESP32-S3, empacota o .kit e publica em Releases.
# Roda sob demanda; a versão do pacote vem do manifest (não do run number).
#
# Pendências conhecidas:
#  - a carga da Tool no dispositivo ainda não foi validada em HW para Tools de
#    UI completa (ver kit/tools-sdk/docs/tool_lvgl_runtime.md);
#  - assinatura Ed25519 (ADR-0012 / kit-cli sign + segredo da chave de release)
#    ainda não está ligada.

on:
  workflow_dispatch:
    inputs:
      tool_id:
        description: 'id da Tool em tools/ (ex: io.github.jcrvlh.tarot)'
        required: true

permissions:
  contents: write   # criar Releases

env:
  LVGL_VERSION: v9.5.0   # bate com kit/firmware/dependencies.lock

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kit-tools
        uses: actions/checkout@v4
        with: { path: kit-tools }

      - name: Checkout SDK (jcrvlh/kit)
        uses: actions/checkout@v4
        with: { repository: jcrvlh/kit, path: kit }

      - name: Checkout LVGL (headers para o build da Tool)
        uses: actions/checkout@v4
        with:
          repository: lvgl/lvgl
          ref: ${{ env.LVGL_VERSION }}
          path: lvgl

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: pip install ./kit/tools-sdk/cli jsonschema

      - name: Validar a Tool
        working-directory: kit-tools
        run: python scripts/validate_tool.py "tools/${{ inputs.tool_id }}"

      # O `kit-cli build --target xtensa` só precisa do compilador xtensa no PATH
      # (não do ESP-IDF inteiro). Rodar no host — e não num container — deixa o
      # kit-cli instalado pelo pip acessível.
      - name: Instalar toolchain Xtensa (esp-13.2.0)
        run: |
          url=https://github.com/espressif/crosstool-NG/releases/download/esp-13.2.0_20240530/xtensa-esp-elf-13.2.0_20240530-x86_64-linux-gnu.tar.xz
          curl -sSL "$url" | tar -xJ
          echo "$PWD/xtensa-esp-elf/bin" >> "$GITHUB_PATH"

      - name: Compilar para ESP32-S3 e empacotar
        working-directory: kit-tools/tools/${{ inputs.tool_id }}
        env:
          KIT_SDK_PATH: ${{ github.workspace }}/kit/tools-sdk
          KIT_LVGL_DIR: ${{ github.workspace }}/lvgl
        run: |
          kit-cli build . --target xtensa
          xtensa-esp32s3-elf-nm -D tool.so | grep -w tool_init
          xtensa-esp32s3-elf-nm -D tool.so | grep -w tool_destroy
          kit-cli pack . -o "${{ inputs.tool_id }}.kit"
          kit-cli info "${{ inputs.tool_id }}.kit"

      - name: Ler versão do manifest
        id: ver
        run: |
          v=$(python -c "import json;print(json.load(open('kit-tools/tools/${{ inputs.tool_id }}/manifest.json'))['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # - name: Assinar (ADR-0012)
      #   run: kit-cli sign kit-tools/tools/${{ inputs.tool_id }}/${{ inputs.tool_id }}.kit \
      #          --key <(echo "${{ secrets.KIT_RELEASE_PRIVATE_KEY }}")

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tool_id }}-v${{ steps.ver.outputs.version }}
          files: kit-tools/tools/${{ inputs.tool_id }}/${{ inputs.tool_id }}.kit
          fail_on_unmatched_files: true
